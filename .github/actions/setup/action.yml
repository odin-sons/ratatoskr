name: Setup
description: >-
  Install Node and pnpm (via Corepack, from packageManager), restore the pnpm
  store cache, and install dependencies. The caller must check out the repo
  first; a local composite action can't check itself out (nothing to load it
  from yet).

runs:
  using: composite
  steps:
    - run: corepack enable
      shell: bash
    - uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
