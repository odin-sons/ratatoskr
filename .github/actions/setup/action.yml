name: Setup
description: >-
  Install Node and pnpm (via Corepack, from packageManager), restore the pnpm
  store cache, and install dependencies. The caller must check out the repo
  first; a local composite action can't check itself out (nothing to load it
  from yet).

runs:
  using: composite
  steps:
    - id: pm
      run: echo "value=$(node -p "require('./package.json').packageManager")" >> "$GITHUB_OUTPUT"
      shell: bash
    - run: corepack enable
      shell: bash
    - uses: actions/cache@v6
      with:
        path: ~/.cache/node/corepack
        key: corepack-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.value }}
    - uses: actions/setup-node@v7
      with:
        node-version: 24
    - id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash
    - uses: actions/cache@v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.value }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ steps.pm.outputs.value }}-
    - run: pnpm install --frozen-lockfile
      shell: bash
