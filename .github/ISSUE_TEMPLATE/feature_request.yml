name: Feature request
description: A new capability or a change in behavior.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        The bot runs on the Cloudflare Workers free plan: 10 ms CPU and 50 subrequests per run, no inbound routes, no runtime dependencies (see `AGENTS.md`, "Hard constraints"). A proposal that needs more than that will be discussed against those limits first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you cannot do today, or what is awkward, and who runs into it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What the bot should do instead. Mention any new setting, secret or variable it would need.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you use now, or other designs you ruled out.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Thunderstore source
        - Hexium source
        - Nexus source
        - A new source
        - Message rendering
        - Delivery to Discord
        - Subscriptions and filters
        - Monitoring and alerts
        - Deployment and scripts
        - Documentation
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Would you send a pull request?
      options:
        - "Yes"
        - Maybe, with guidance
        - "No"
    validations:
      required: true
