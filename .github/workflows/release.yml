name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Extract changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="[$version]" '
            index($0, "## " ver) == 1 { found=1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG.md section found for $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md

  deploy:
    needs: release
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm run deploy
        env:
          D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RATATOSKR_LANGUAGE: ${{ secrets.RATATOSKR_LANGUAGE }}
          RATATOSKR_EMOJI: ${{ secrets.RATATOSKR_EMOJI }}
          STORE_EMOJI_THUNDERSTORE: ${{ secrets.STORE_EMOJI_THUNDERSTORE }}
          STORE_EMOJI_HEXIUM: ${{ secrets.STORE_EMOJI_HEXIUM }}
          STORE_EMOJI_NEXUS: ${{ secrets.STORE_EMOJI_NEXUS }}
